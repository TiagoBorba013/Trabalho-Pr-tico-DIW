<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - FutballNews</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <nav class="navbar navbar-dark bg-dark px-3">
    <a class="navbar-brand text-warning" href="index.html">⚽ FutballNews</a>
  </nav>

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-4">
        <div class="card shadow-sm border-0 p-4">
          <h4 class="fw-bold mb-4 text-center">Login</h4>

          <div id="msg-erro" class="alert alert-danger d-none"></div>

          <div class="mb-3">
            <label class="form-label">Login</label>
            <input type="text" id="input-login" class="form-control">
          </div>
          <div class="mb-3">
            <label class="form-label">Senha</label>
            <input type="password" id="input-senha" class="form-control">
          </div>
          <button onclick="fazerLogin()" class="btn btn-success w-100 mb-3">Entrar</button>
          <p class="text-center text-muted small">
            Não tem conta? <a href="cadastro.html">Cadastre-se</a>
          </p>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
