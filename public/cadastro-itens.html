<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Itens - FutballNews</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <nav class="navbar navbar-dark bg-dark px-3 sticky-top">
    <a class="navbar-brand text-warning" href="index.html">⚽ FutballNews</a>
    <div id="menu-nav" class="d-flex gap-2"></div>
  </nav>

  <div class="container py-4">

    <h4 class="fw-bold mb-4 border-start border-4 border-warning ps-3">Cadastro de Notícias</h4>

    <div class="card shadow-sm border-0 p-4 mb-5">
      <div id="msg-crud" class="alert d-none"></div>

      <input type="hidden" id="crud-id">

      <div class="row g-3">
        <div class="col-md-8">
          <label class="form-label">Título</label>
          <input type="text" id="crud-titulo" class="form-control">
        </div>
        <div class="col-md-4">
          <label class="form-label">Categoria</label>
          <input type="text" id="crud-categoria" class="form-control">
        </div>
        <div class="col-12">
          <label class="form-label">Descrição (resumo)</label>
          <input type="text" id="crud-descricao" class="form-control">
        </div>
        <div class="col-12">
          <label class="form-label">Conteúdo completo</label>
          <textarea id="crud-conteudo" class="form-control" rows="3"></textarea>
        </div>
        <div class="col-md-6">
          <label class="form-label">URL da Imagem</label>
          <input type="text" id="crud-imagem" class="form-control">
        </div>
        <div class="col-md-6">
          <label class="form-label">Data (AAAA-MM-DD)</label>
          <input type="date" id="crud-data" class="form-control">
        </div>
      </div>

      <div class="d-flex gap-2 mt-4">
        <button onclick="salvarNoticia()" class="btn btn-success">Salvar</button>
        <button onclick="limparFormulario()" class="btn btn-outline-secondary">Limpar</button>
      </div>
    </div>

    <h5 class="fw-bold mb-3">Notícias Cadastradas</h5>
    <div class="table-responsive">
      <table class="table table-bordered align-middle">
        <thead class="table-dark">
          <tr>
            <th>ID</th>
            <th>Título</th>
            <th>Categoria</th>
            <th>Data</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="tabela-noticias"></tbody>
      </table>
    </div>

  </div>

  <footer class="text-white text-center py-3">
    <small>© 2026 FutballNews — Todos os direitos reservados</small>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
